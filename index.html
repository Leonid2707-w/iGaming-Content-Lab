<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        const saved = localStorage.getItem('icl-theme')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="iGaming Content Lab — агентство контента для вебмастеров iGaming. Видео-креативы, посты и ведение Telegram, Instagram, TikTok, YouTube."
    />
    <meta property="og:title" content="iGaming Content Lab" />
    <meta
      property="og:description"
      content="Делегируйте контент — получайте результат. Стандартные и нестандартные заказы для iGaming."
    />
    <meta property="og:type" content="website" />
    <title>iGaming Content Lab — контент для iGaming</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
